<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" role="img" aria-labelledby="title desc">
  <title id="title">Portfilo</title>
  <desc id="desc">Portfilo monochrome ink wordmark.</desc>
  <style>
    @font-face {
      font-family: "Instrument Sans";
      font-style: normal;
      font-display: swap;
      font-weight: 400 700;
      src: url("https://cdn.jsdelivr.net/fontsource/fonts/instrument-sans:vf@5.3.0/latin-wght-normal.woff2") format("woff2-variations");
    }
    .wordmark {
      font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 100px;
      font-weight: 700;
      letter-spacing: -8.5px;
      font-synthesis: none;
      fill: #171614;
    }
  </style>
  <g transform="translate(25 0) skewX(-12)">
    <text class="wordmark" x="0" y="98">Portfilo</text>
  </g>
</svg>
